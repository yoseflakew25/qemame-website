# QEMAME TRADING PLC - Next.js static export server
# The platform terminates TLS, so plain HTTP on :8080.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # The document is never cached. A rebuild must never be masked by a
    # browser holding on to yesterday's markup while it loads today's CSS.
    location = / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Next.js static assets are versioned, so they can be held.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Original assets are versioned in the markup (site.css?v=N), so they can be held.
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }

}
